<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Pawtallica – Tu mascota, tu rock, tu estilo</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <img src="{{ url_for('static', filename='imagenes/logo.png') }}" height="100" alt="Logo Pawtallica">
        </div>

        <nav>
            <button data-vista="inicio" class="activo" onclick="irA('inicio')">Inicio</button>
            <button data-vista="tienda" onclick="irA('tienda')">Tienda</button>
            <button data-vista="ofertas" onclick="irA('ofertas')">Ofertas</button>
        </nav>

        <div class="iconos">

            <button onclick="abrir('buscador')" aria-label="Buscar">
                <img src="{{ url_for('static', filename='imagenes/busqueda.png') }}" height="18" alt="Buscar">
            </button>

            <button onclick="abrir('usuario')" aria-label="Usuario">
                <img src="{{ url_for('static', filename='imagenes/perfil.png') }}" height="30" alt="Perfil">
            </button>

            <button onclick="abrir('carrito')" aria-label="Carrito">
                <img src="{{ url_for('static', filename='imagenes/carrito.png') }}" height="40" alt="Carrito">
                <span id="contador">0</span>
            </button>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- INICIO -->
        <section id="v-inicio" class="vista activa">

            <div class="banner">
                <img
                    src="{{ url_for('static', filename='imagenes/banner.jpg') }}"
                    alt="Pawtallica: tienda de ropa y accesorios rockeros para mascotas"
                    class="imagen-banner">
            </div>

            <h2>
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
                Productos destacados
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
            </h2>

            <div class="grid" id="g-destacados"></div>

        </section>


        <!-- TIENDA -->
        <section id="v-tienda" class="vista">

            <h2>
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
                Tienda
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
            </h2>

            <div class="filtros" id="filtros"></div>

            <div class="grid" id="g-tienda"></div>

        </section>


        <!-- OFERTAS -->
        <section id="v-ofertas" class="vista">

            <h2>
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
                Ofertas
                <img src="{{ url_for('static', filename='imagenes/rayo1.png') }}" height="40" alt="">
            </h2>

            <div class="grid" id="g-ofertas"></div>

        </section>

        <!-- RESULTADOS DE BUSQUEDA -->
        <section id="v-busqueda" class="vista">

            <h2 id="t-busqueda">Resultados</h2>

            <div class="grid" id="g-busqueda"></div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <div>
            <h4>Información</h4>
            <a href="/inventario">Administrar inventario</a>

            <a onclick="info('Sobre nosotros')">Sobre nosotros</a>

            <a onclick="info('Términos y condiciones')">
                Términos y condiciones
            </a>

            <a onclick="info('Política de privacidad')">
                Política de privacidad
            </a>
        </div>


        <div>
            <h4>Ayuda</h4>

            <a onclick="info('Preguntas frecuentes')">
                Preguntas frecuentes
            </a>

            <a onclick="info('Métodos de pago')">
                Métodos de pago
            </a>

            <a onclick="info('Envíos y devoluciones')">
                Envíos y devoluciones
            </a>
        </div>


        <div>
            <h4>Síguenos</h4>

            <div class="redes">

                <a href="https://www.instagram.com/"
                target="_blank">
                    <img src="{{ url_for('static', filename='imagenes/icono_instagram.png') }}" height="20" alt="Instagram">
                </a>

                <a href="https://www.facebook.com/"
                target="_blank">
                    <img src="{{ url_for('static', filename='imagenes/facebook.png') }}" height="22" alt="Facebook">
                </a>

                <a href="https://www.tiktok.com/es/"
                target="_blank">
                    <img src="{{ url_for('static', filename='imagenes/tiktok.png') }}" height="21" alt="TikTok">
                </a>

            </div>
        </div>

    </footer>


    <!-- FONDO DE LOS PANELES -->
    <div class="fondo" id="fondo" onclick="cerrarTodo()"></div>


    <!-- CARRITO DE COMPRAS -->
    <aside class="carrito" id="carrito">

        <button class="cerrar" onclick="cerrarTodo()">✕</button>

        <h3>
            <img src="{{ url_for('static', filename='imagenes/carrito.png') }}" height="40" alt="">
            Tu carrito
        </h3>

        <div id="items"></div>

        <div class="total">
            Total: <span id="total">$0</span>
        </div>

        <button class="btn" onclick="pagar()">
            Finalizar compra
        </button>

        <button
            style="margin-top:8px;color:var(--gris)"
            onclick="vaciar()">
            Vaciar carrito
        </button>

    </aside>


    <!-- BUSCADOR -->
    <div class="modal" id="buscador">

        <button class="cerrar" onclick="cerrarTodo()">✕</button>

        <h3>Buscar productos</h3>

        <input
            id="q"
            placeholder="Ej: Metallica, bandana…"
            onkeydown="if(event.key==='Enter')buscar()">

        <button class="btn" onclick="buscar()">Buscar</button>

    </div>


    <!-- USUARIO -->
    <div class="modal" id="usuario">

        <button class="cerrar" onclick="cerrarTodo()">✕</button>

        <h3 id="u-titulo">Iniciar sesión</h3>

        <div id="u-form">

            <input id="u-nombre" placeholder="Tu nombre">

            <input
                id="u-correo"
                type="email"
                placeholder="Correo electrónico">

            <button class="btn" onclick="entrar()">Entrar</button>

        </div>

        <div id="u-ok" style="display:none">

            <p id="u-saludo"></p>

            <button class="btn" onclick="salir()">
                Cerrar sesión
            </button>

        </div>

    </div>


    <!-- VENTANA DE INFORMACIÓN -->
    <div class="modal" id="infoModal">

        <button class="cerrar" onclick="cerrarTodo()">✕</button>

        <h3 id="i-titulo"></h3>

        <p id="i-texto"></p>

    </div>

<!--FOOTER-->
<style>
    body{
        margin: 0%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    footer{
        margin-top: auto;
    }
</style>

<!-- VISOR DE IMÁGENES -->
<div class="visor-imagen" id="visor-imagen">

    <button class="cerrar-visor" id="cerrar-visor">
        &times;
    </button>

    <img id="imagen-ampliada" src="" alt="">

</div>
    
<!-- CONEXIÓN CON JAVASCRIPT -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
